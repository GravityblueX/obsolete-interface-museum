name: Validate source references

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-references:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test source-reference validation
        run: python -B -m unittest discover -s tests -p "test_source_references.py" -v

      - name: Validate checked-in source references
        run: python -B scripts/validate_source_references.py
